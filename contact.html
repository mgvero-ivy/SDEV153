<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact Marko's Summer Fishing Blog to ask a fishing question, recommend a fishing location, or share a fishing story.">

    <title>Contact Me | Marko's Summer Fishing Blog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

    <a class="site-brand"
       href="index.html"
       aria-label="Go to the home page">

        <img class="site-logo"
             src="images/fishing-logo.png"
             alt="Marko's Summer Fishing Blog logo">

        <h1>Marko's Summer Fishing Blog</h1>

    </a>

</header>

<nav>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="posts.html">Posts</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</nav>


<main class="contact-page">
    <section class="contact-intro">
        <h2>Contact Me</h2>

        <p>
            Have a fishing story, location recommendation, or question?
            Fill out the form below to get in touch.
        </p>
    </section>

    <form id="contact-form" novalidate>
        <div class="form-group">
            <label for="name">Name:</label>

            <input type="text"
                   id="name"
                   name="name"
                   required>
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>

            <input type="email"
                   id="email"
                   name="email"
                   required>
        </div>

        <div class="form-group">
            <label for="reason">Reason for Contacting Me:</label>

            <select id="reason" name="reason" required>
                <option value="">Select a reason</option>
                <option value="question">Fishing question</option>
                <option value="location">Fishing location recommendation</option>
                <option value="story">Share a fishing story</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>

            <textarea id="message"
                      name="message"
                      rows="6"
                      required></textarea>
        </div>

        <button type="submit">Submit Message</button>

        <p id="form-message" aria-live="polite"></p>
    </form>

</main>


<footer>

    <p>2026 Marko's Summer Fishing Blog</p>

</footer>

    <script src="contact.js"></script>

</body>

</html>
